# Build and publish the Windows desktop installer.
#
# Separate from ci.yml on purpose. That workflow answers "is this commit
# sound?" and runs on every push; this one answers "is this artefact
# shippable?" and runs on a tag. Merging them would mean either building
# an installer on every push or gating every push on a Windows-only
# toolchain.
#
# The release gate is `scripts/build_desktop.ps1`, and specifically the
# smoke test inside it: it starts the staged interpreter, runs a real
# plugin out of process, and serves the exported UI. Everything it checks
# is invisible to the test suite, because none of those mechanisms exist
# when pytest runs from a checkout.
#
#   git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#
# **Source and distribution live in different repositories**, and this
# file runs in the one that has the source. Development moved to the
# private organisation repository; the public repository it came from
# keeps its releases, because the permanent download link is that
# repository's path and every installed copy of the app has the same
# path compiled into `updater.REPOSITORY`. Moving distribution would
# have broken the link somebody sent a colleague last month and left
# every install checking a repository that had stopped publishing.
#
# So the build happens here and the release is created *there*, with a
# credential that only exists here. See PUBLISH_REPOSITORY below.

name: desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (off = build and smoke test only)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  #: Where releases are published, which is not where this runs. The
  #: path is load-bearing rather than cosmetic: it is the permanent
  #: download link, and it is compiled into every installed copy of the
  #: app as `updater.REPOSITORY`.
  PUBLISH_REPOSITORY: hungnguyen-1601/T011-rav19-planbench

  #: Where the source lives, and so where an installer may be built.
  #: The guard on the job below reads this.
  SOURCE_REPOSITORY: AI20K-Build-Phase-Cohort-3/P-011

jobs:
  build:
    runs-on: windows-latest
    # **One file, two repositories, and it must only build in one of
    # them.** This workflow is present in the distribution repository
    # too — it arrived with the history that was copied there — and
    # without this guard a tag pushed to that repository would build a
    # second installer from a frozen tree and publish it over the real
    # one. Reading the repository name rather than maintaining two
    # copies of the file: two copies drift, and the drift would be
    # discovered at a release.
    if: github.repository == 'AI20K-Build-Phase-Cohort-3/P-011'
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          # The same minor version the installer ships. pip builds C
          # extensions for the interpreter it runs on, so a mismatch here
          # produces wheels the shipped Python cannot import — and the
          # error names the module rather than the cause.
          python-version: "3.12"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Read the version stamp
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content 'apps/desktop/planbench_desktop/VERSION' -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=desktop-v$version" >> $env:GITHUB_OUTPUT
          Write-Host "version $version"

      - name: The tag and the version stamp must agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = '${{ steps.version.outputs.tag }}'
          if ($tag -ne $expected) {
            # Otherwise the release is named one thing and the installed
            # application reports another, and the updater — which
            # compares the tag against the running VERSION — offers the
            # same update forever.
            throw "tag $tag does not match the version stamp ($expected)"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and smoke test the installer
        shell: pwsh
        run: ./scripts/build_desktop.ps1

      - name: Write the release manifest
        id: manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          # By name, not "the first .exe": a working tree that has built
          # an older version still has its installer sitting in dist/,
          # and publishing whichever one sorts first is how a release
          # ends up carrying the wrong build.
          $installer = Get-Item 'dist\PlanBench-Setup.exe' -ErrorAction SilentlyContinue
          if (-not $installer) { throw 'the build produced no dist\PlanBench-Setup.exe' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          # The updater refuses any download that does not hash to this.
          # It is the only check between fetching a file and running it
          # with the user's privileges, so it is written here, from the
          # artefact this job just built.
          @{
            version = $version
            asset   = $installer.Name
            sha256  = $hash
            built   = (Get-Date -Format 'o')
          } | ConvertTo-Json | Set-Content 'dist/latest.json' -Encoding utf8
          Write-Host "$($installer.Name)  $hash"
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Keep the artefacts even when not publishing
        uses: actions/upload-artifact@v4
        with:
          name: planbench-desktop-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/latest.json
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          # **Not `github.token`.** The automatic token is scoped to the
          # repository the job runs in, and the release has to be created
          # in another one. This is a fine-grained token with `contents:
          # write` on the distribution repository and nothing else, held
          # as a secret here.
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          # `latest.json` is an asset of the release it describes, not a
          # file at a fixed URL: a manifest that outlives its installer
          # is a hash mismatch waiting to happen.
          #
          # `--target` names the branch the tag is created on, because
          # the tag does not exist in the distribution repository — the
          # commit it was pushed against lives here, in the private one.
          # The tag there is a label on a frozen tree; the build's real
          # provenance is the identically named tag in this repository,
          # and the SHA the installer stamps into its System page.
          #
          # **No `--generate-notes`.** It would summarise commits — of
          # this repository, which is private. Publishing its commit
          # subjects on a public release page is a leak with no upside,
          # so the body says what shipped and nothing about how.
          $version = '${{ steps.version.outputs.version }}'
          gh release create $tag dist/PlanBench-Setup.exe dist/latest.json `
            --repo $env:PUBLISH_REPOSITORY `
            --target main `
            --title "PlanBench $version" `
            --notes "PlanBench desktop $version for Windows. Install or update from ``PlanBench-Setup.exe`` below; an installed copy offers this version on its next launch."
