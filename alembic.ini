; Alembic configuration.
;
; The URL is deliberately absent: env.py reads PLANBENCH_DATABASE_URL so
; a connection string with a password never lands in a tracked file.
;
;   PLANBENCH_DATABASE_URL=postgresql://... .venv/bin/alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = packages/schemas:packages/planning:packages/metrics:packages/benchmark:services/simulator:services/tracking:services/agent_service:apps/api
file_template = %%(rev)s_%%(slug)s
timezone = UTC
; Alembic 1.18+: split prepend_sys_path on the OS separator, not spaces.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
