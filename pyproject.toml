[project]
name = "planbench"
version = "0.1.0"
description = "Agentic AI PlanBench — simulator and path/motion planning benchmark for AMR/AGV mobile robots (simulation only)."
requires-python = ">=3.12"

# NOTE (Phase 1A): this repository is not yet packaged for installation.
# Tests import the packages directly from source via the pytest
# `pythonpath` setting below. Per-package pyproject files will be added
# when other services need to install them (Phase 2+).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    # The repository root, so `src.*` (the T-011 scaffold) resolves, and
    # `tests/`, so shared helpers like `agent_fakes` import as top-level
    # modules. Both used to work by accident: pytest puts a test file's
    # first non-package parent on sys.path, and `tests/` had no
    # `__init__.py`. Adding one turned `tests/` into a package and broke
    # every `import agent_fakes`. Naming the paths here makes it work
    # either way.
    ".",
    "tests",
    "packages/schemas",
    "packages/planning",
    "packages/metrics",
    "packages/benchmark",
    "packages/decision",
    "packages/plugin_sdk",
    "services/simulator",
    "services/tracking",
    "services/agent_service",
    "ml",
    "apps/api",
]

# Ruff is configured in `ruff.toml` at the repository root, not here.
# A root `ruff.toml` replaces `[tool.ruff]` outright instead of merging
# with it, so keeping settings in both places means one copy is silently
# dead — which is how CI ended up disagreeing with local runs about
# import order. One file, one answer.

[tool.coverage.run]
branch = true
