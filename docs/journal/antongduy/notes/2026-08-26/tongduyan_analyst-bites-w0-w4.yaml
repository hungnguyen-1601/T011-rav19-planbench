name: "Gates added by the improvement plan (W0-W4)"
workdir: "E:/VinAI/RoboMind_project/P-011-analyst"
gate: >-
  python -m pytest tests/test_analyst_eval_spec.py tests/test_analyst_measurements.py
  tests/test_analyst_timeline.py tests/test_analyst_features.py
  tests/test_analyst_traits_snapshot.py tests/test_analyst_traits_review.py
  tests/test_analyst_candidates.py tests/test_analyst_routing.py
  tests/test_analyst_union.py tests/test_analyst_scoring.py
  tests/test_analyst_retrieval_round.py
  -q --no-header -p no:cacheprovider

exclude:
  - node_modules
  - .next
  - .ai-log
  - artifacts
  - maps
  - docs
  - presentation
  - ros2_ws
  - "*.db"
  - .pytest_cache
  - .ruff_cache
  - .mypy_cache
  - .codegraph
  - .omc
  - .venv
  - .tmp
  - .claude

clean:
  exit: 0
  output_contains: "passed"

bites:
  # ---- W0: the evaluation foundation ------------------------------------
  - id: EVAL_PARTITION_GATE_OFF
    mo_ta: "a confirmatory label file loads like any other"
    inject:
      file: services/analyst_service/planbench_analyst/eval_spec.py
      replace: '    if spec.partition != "development":'
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_confirmatory_label_file_is_refused"

  - id: PREREGISTRATION_DELTA_MOVED
    mo_ta: "the non-inferiority margin is widened after the fact"
    inject:
      file: services/analyst_service/planbench_analyst/preregistration.py
      replace: "delta: float = 0.10"
      with: "delta: float = 0.20"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_the_preregistration_is_pinned"

  - id: PASS_HAT_K_REPORTS_A_RATE_ON_THREE_CASES
    mo_ta: "reliability travels as a number below the case threshold"
    inject:
      file: services/analyst_service/planbench_analyst/harness.py
      replace: "    if cases < min_cases:"
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_pass_hat_k_does_not_travel_as_a_number_on_too_few_cases"

  # ---- W1: the data path and its identity -------------------------------
  - id: MEASUREMENT_REFUSALS_COLLAPSE
    mo_ta: "a mistyped candidate id reads as a missing feature"
    inject:
      file: packages/explanation/planbench_explanation/packet_facts.py
      replace: 'return FactRefusal("candidate_not_in_packet")'
      with: 'return FactRefusal("measurements_not_recorded")'
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_candidate_the_packet_does_not_compare_is_named_as_such"

  - id: TIMELINE_CLOCK_RESOLVED_FOR_THE_READER
    mo_ta: "an unrecognised clock quietly becomes wall-clock"
    inject:
      file: packages/explanation/planbench_explanation/packet_facts.py
      replace: 'if clock not in ("at_time", "at_progress"):'
      with: "if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_an_unrecognised_clock_is_refused_rather_than_resolved"

  - id: SHARED_EPISODE_ANSWERED_FOR_WHOEVER_CAME_FIRST
    mo_ta: "an episode both candidates drove is answered without saying whose"
    inject:
      file: packages/explanation/planbench_explanation/packet_facts.py
      replace: "    elif len(matching) > 1:"
      with: "    elif False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_an_episode_both_candidates_drove_needs_a_candidate"

  - id: EVIDENCE_TOKEN_NOT_DERIVED_FROM_THE_PACKET
    mo_ta: "a packet with no measurements still offers the tool that reads them"
    inject:
      file: services/analyst_service/planbench_analyst/round_host.py
      replace: "    if not packet.measurements:"
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_packet_with_no_measurements_withholds_the_evidence"

  - id: ARM_VECTOR_OUT_OF_THE_IDENTITY
    mo_ta: "two arms share one runtime checksum"
    inject:
      file: services/analyst_service/planbench_analyst/identity.py
      replace: '"features": (features or RoundFeatures()).as_config,'
      with: '"features": {},'
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_every_flag_changes_the_runtime_checksum"

  - id: TRAITS_USED_WITHOUT_DECLARING_THEM
    mo_ta: "the prompt carries natures the checksum says were off"
    inject:
      file: services/analyst_service/planbench_analyst/runner.py
      replace: "    if traits is not None and not features.traits:"
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_handing_traits_to_a_round_that_does_not_declare_them_is_refused"

  - id: SNAPSHOT_CHECKSUM_TRUSTED_NOT_RECOMPUTED
    mo_ta: "a snapshot edited in place still serves"
    inject:
      file: services/analyst_service/planbench_analyst/traits_snapshot.py
      replace: "    if snapshot.checksum != _checksum_in_name(path):"
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_file_edited_in_place_is_refused_rather_than_served"

  - id: REFERENCED_SNAPSHOT_DELETABLE
    mo_ta: "a document a live bundle cites can be removed"
    inject:
      file: services/analyst_service/planbench_analyst/traits_snapshot.py
      replace: "    if referenced_by:"
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_referenced_snapshot_is_not_deletable"

  - id: TRAIT_ANCHOR_RULE_OFF
    mo_ta: "folklore in a table can be approved"
    inject:
      file: packages/benchmark/planbench_benchmark/traits_review.py
      replace: "    if not independent_anchor(entry):"
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_an_anchor_that_repeats_the_claim_is_not_one"

  - id: GOLDEN_LOCK_OFF
    mo_ta: "a promoting run starts with unreviewed natures in its snapshot"
    inject:
      file: packages/benchmark/planbench_benchmark/traits_review.py
      replace: "    if promoting and pending:"
      with: "    if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_promoting_golden_run_refuses_while_a_row_is_unreviewed"

  # ---- W2: the shortlist -------------------------------------------------
  - id: DISTRACTORS_ESCAPE_DEVELOPMENT
    mo_ta: "invented mechanisms reach a production shortlist"
    inject:
      file: services/analyst_service/planbench_analyst/candidates.py
      replace: 'if partition != "development":'
      with: "if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_distractors_are_refused_outside_a_development_partition"

  - id: GOLD_DROPPED_WITHOUT_BEING_NAMED
    mo_ta: "the harness guesses which candidate the answer was"
    inject:
      file: services/analyst_service/planbench_analyst/candidates.py
      replace: "        if gold is None:"
      with: "        if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_dropping_the_gold_candidate_has_to_be_told_which_one_it_is"

  - id: SHORTLIST_FORCES_A_CHOICE
    mo_ta: "the list arrives with no way to decline"
    inject:
      file: services/analyst_service/planbench_analyst/candidates.py
      replace: "    shortlist.append("
      with: "    _unused = ("
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_unknown_is_always_on_the_list_and_always_last"

  - id: A_NATURE_INVENTS_A_MECHANISM
    mo_ta: "an algorithm's reputation becomes a candidate on its own"
    inject:
      file: services/analyst_service/planbench_analyst/candidates.py
      replace: "        for key, candidate in list(found.items()):"
      with: "        _merge(found, 'local_minimum_entrapment', subject, offer.ref, 'traits')\n        for key, candidate in list(found.items()):"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_nature_raises_a_mechanism_and_cannot_invent_one"

  # ---- W3: the menu and the router --------------------------------------
  - id: MENU_KEEPS_WHAT_THE_RUN_CANNOT_SERVE
    mo_ta: "a card refused at admission is still offered"
    inject:
      file: services/analyst_service/planbench_analyst/routing.py
      replace: "        if not set(card.required_evidence) <= set(available_evidence):"
      with: "        if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_card_this_run_cannot_serve_is_taken_off_the_menu"

  - id: FILTER_HIDES_THE_WAY_OF_FINDING_OUT
    mo_ta: "fact queries are filtered by a mechanism nobody has chosen"
    inject:
      file: services/analyst_service/planbench_analyst/routing.py
      replace: '        if card.tool_class == "mechanism_check" and wanted and not unknown_in_play:'
      with: "        if wanted and not unknown_in_play:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_filtering_never_removes_a_way_of_finding_out_which_mechanism"

  - id: ROUTER_FILLS_THE_ANALYSTS_ARGUMENT
    mo_ta: "the platform picks how hard to look and then grades what it found"
    inject:
      file: services/analyst_service/planbench_analyst/routing.py
      replace: "        value = _value_for(spec.source, proposal, packet)"
      with: "        value = _value_for(spec.source, proposal, packet) or 1.5"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_an_analyst_argument_is_left_out_rather_than_defaulted"

  - id: ROUTING_FAILURES_COLLAPSE_TO_ONE
    mo_ta: "four different fixes become one number"
    inject:
      file: services/analyst_service/planbench_analyst/routing.py
      replace: '        return None, "missing_required_evidence"'
      with: '        return None, "tool_not_in_menu"'
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_run_that_never_recorded_the_evidence_is_a_different_reason"

  # ---- W4: the union, the draft and the repair --------------------------
  - id: UNION_NOT_ENFORCED
    mo_ta: "a final statement may also ask for a check"
    inject:
      file: services/analyst_service/planbench_analyst/analyst.py
      replace: '        if decision == "no_check" and tool_id:'
      with: "        if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_final_statement_that_also_asks_for_a_check_is_refused"

  - id: DRAFT_MAY_REPORT_ITS_OWN_VERDICT
    mo_ta: "a sentence written before the check claims the check confirmed it"
    inject:
      file: services/analyst_service/planbench_analyst/guard.py
      replace: "        if proposal.requested_checks:"
      with: "        if False:"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_draft_that_reports_its_own_verdict_is_blocked"

  - id: REPAIR_IS_UNBOUNDED
    mo_ta: "the round repairs until it parses"
    inject:
      file: services/analyst_service/planbench_analyst/runner.py
      replace: "            and not repaired"
      with: "            and True"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_second_malformed_answer_does_not_buy_a_second_repair"

  - id: AUDIT_LINK_DROPPED
    mo_ta: "a superseded draft leaves no trail to what replaced it"
    inject:
      file: services/analyst_service/planbench_analyst/runner.py
      replace: '                events.append(f"supersedes:{previous}:{proposal.hypothesis_id}")'
      with: "                pass"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_revised_statement_carries_the_link_to_what_it_replaced"

  # ---- The scorer --------------------------------------------------------
  - id: A_CASE_PASSES_ON_ITS_BEST_REPEAT
    mo_ta: "right once out of three counts as a correct case"
    inject:
      file: services/analyst_service/planbench_analyst/scoring.py
      replace: "        return bool(self.repeats) and all(item.mechanism_correct for item in self.repeats)"
      with: "        return bool(self.repeats) and any(item.mechanism_correct for item in self.repeats)"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_case_is_correct_only_when_every_repeat_was"

  - id: A_MISSING_LABEL_PASSES
    mo_ta: "a suite that lost its labels reports a perfect score"
    inject:
      file: services/analyst_service/planbench_analyst/scoring.py
      replace: "            mechanism_correct=False,\n            subject_correct=False,"
      with: "            mechanism_correct=True,\n            subject_correct=True,"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_case_with_no_label_scores_zero_rather_than_passing"

  - id: A_DRAFT_IS_SCORED
    mo_ta: "a sentence written before its evidence counts as a finding"
    inject:
      file: services/analyst_service/planbench_analyst/scoring.py
      replace: "    finals = [proposal for proposal in response.proposals if not proposal.requested_checks]"
      with: "    finals = list(response.proposals)"
      count: 1
    expect:
      exit_not_zero: true
      output_contains: "test_a_draft_is_not_scored"
